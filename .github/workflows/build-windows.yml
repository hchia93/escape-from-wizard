name: Build-Windows

on:
  push:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'script/**'
      - '.github/workflows/build-windows.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'script/**'
      - '.github/workflows/build-windows.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore src/escape-from-wizard.csproj

      - name: Restore tools
        run: dotnet tool restore
        working-directory: src

      - name: Build content
        run: dotnet mgcb /@:"Game/Content/Content.mgcb" /platform:Windows
        working-directory: src

      - name: Publish
        run: dotnet publish src/escape-from-wizard.csproj -c Release -r win-x64 --self-contained true /p:PublishSingleFile=true /p:IncludeNativeLibrariesForSelfExtract=true

      - name: Copy Content
        run: |
          New-Item -ItemType Directory -Force -Path src/bin/Release/net8.0/win-x64/publish/Content | Out-Null
          Copy-Item -Recurse -Force src/bin/Content/Windows/* src/bin/Release/net8.0/win-x64/publish/Content/

       - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-publish
          path: src/bin/Release/net8.0/win-x64/publish/

      - name: Zip build output
        run: |
          cd src/bin/Release/net8.0/win-x64/publish
          powershell Compress-Archive -Path * -DestinationPath ../../../EscapeFromWizard_Windows_Release.zip

      - uses: softprops/action-gh-release@v2
        with:
          name: Latest Windows Build
          tag_name: latest-windows
          files: src/bin/Release/EscapeFromWizard_Windows_Release.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true