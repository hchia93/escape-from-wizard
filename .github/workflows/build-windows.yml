name: Build-Windows

on:
  push:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'script/**'
      - '.github/workflows/build-windows.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'script/**'
      - '.github/workflows/build-windows.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore src/escape-from-wizard.csproj

      - name: Restore tools
        run: dotnet tool restore
        working-directory: src

      - name: Build content
        run: dotnet mgcb /@:"Game/Content/Content.mgcb" /platform:Windows
        working-directory: src

      - name: Publish
        run: dotnet publish src/escape-from-wizard.csproj -c Release -r win-x64 --self-contained true /p:PublishSingleFile=true /p:IncludeNativeLibrariesForSelfExtract=true

      - name: Copy native dependencies and runtimes
        run: |
          $publishDir = "src/bin/Release/net8.0/win-x64/publish"
          $releaseDir = "src/bin/Release/net8.0/win-x64"
          
          # Copy DLLs from Release directory only
          if (Test-Path "$releaseDir/SDL2.dll") {
            Copy-Item "$releaseDir/SDL2.dll" $publishDir -Force
            Write-Host "Copied SDL2.dll"
          }
          
          if (Test-Path "$releaseDir/soft_oal.dll") {
            Copy-Item "$releaseDir/soft_oal.dll" $publishDir -Force
            Write-Host "Copied soft_oal.dll"
          }
          
          if (Test-Path "$releaseDir/NVorbis.dll") {
            Copy-Item "$releaseDir/NVorbis.dll" $publishDir -Force
            Write-Host "Copied NVorbis.dll"
          }
          
          # Copy runtimes folder if exists
          if (Test-Path "$releaseDir/runtimes") {
            Write-Host "Copying runtimes folder"
            Copy-Item -Recurse -Force "$releaseDir/runtimes" $publishDir
          }

      - name: Copy Content (remove Game/Content hierarchy)
        run: |
          $publishDir = "src/bin/Release/net8.0/win-x64/publish"
          $contentSource = "src/bin/Content/Windows"
          
          New-Item -ItemType Directory -Force -Path "$publishDir/Content" | Out-Null
          
          # Check for Game/Content nested directory
          if (Test-Path "$contentSource/Game/Content") {
            Write-Host "Copying from: $contentSource/Game/Content/"
            Copy-Item -Recurse -Force "$contentSource/Game/Content/*" "$publishDir/Content/"
          } else {
            Write-Host "Copying from: $contentSource/"
            Copy-Item -Recurse -Force "$contentSource/*" "$publishDir/Content/"
          }
          
          # List copied content
          Write-Host "`nContent structure:"
          Get-ChildItem -Recurse "$publishDir/Content/" | Select-Object FullName

      - name: Verify package structure
        run: |
          $publishDir = "src/bin/Release/net8.0/win-x64/publish"
          Write-Host "`n=== Package Structure ==="
          Get-ChildItem $publishDir | Select-Object Name, @{Name="Type";Expression={if($_.PSIsContainer){"Directory"}else{"File"}}}
          Write-Host "`n=== Content Directory ==="
          if (Test-Path "$publishDir/Content") {
            Get-ChildItem "$publishDir/Content" -Recurse | Select-Object FullName
          } else {
            Write-Host "ERROR: Content directory not found!"
          }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-publish
          path: src/bin/Release/net8.0/win-x64/publish/

      - name: Zip build output
        run: |
          cd src/bin/Release/net8.0/win-x64/publish
          Compress-Archive -Path * -DestinationPath ../../../EscapeFromWizard_Windows_Release.zip -Force

      - uses: softprops/action-gh-release@v2
        with:
          name: Latest Windows Build
          tag_name: latest-windows
          files: src/bin/Release/EscapeFromWizard_Windows_Release.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true