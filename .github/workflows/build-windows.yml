name: Build-Windows

on:
  push:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'script/**'
      - '.github/workflows/build-windows.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'script/**'
      - '.github/workflows/build-windows.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore src/escape-from-wizard.csproj

      - name: Restore tools
        run: dotnet tool restore
        working-directory: src

      - name: Build content
        run: dotnet mgcb /@:"Game/Content/Content.mgcb" /platform:Windows
        working-directory: src

      - name: Publish
        run: dotnet publish src/escape-from-wizard.csproj -c Release -r win-x64 --self-contained true /p:PublishSingleFile=true /p:IncludeNativeLibrariesForSelfExtract=true

      - name: Copy native dependencies
        run: |
          $publishDir = "src/bin/Release/net8.0/win-x64/publish"
          
          $releaseDir = "src/bin/Release/net8.0/win-x64"
          if (Test-Path "$releaseDir/SDL2.dll") {
            Copy-Item "$releaseDir/SDL2.dll" $publishDir -Force
          }
          if (Test-Path "$releaseDir/soft_oal.dll") {
            Copy-Item "$releaseDir/soft_oal.dll" $publishDir -Force
          }
          if (Test-Path "$releaseDir/NVorbis.dll") {
            Copy-Item "$releaseDir/NVorbis.dll" $publishDir -Force
          }
          
          if (-not (Test-Path "$publishDir/SDL2.dll")) {
            $debugDir = "src/bin/Debug/net8.0"
            if (Test-Path "$debugDir/SDL2.dll") {
              Copy-Item "$debugDir/SDL2.dll" $publishDir -Force
            }
          }
          if (-not (Test-Path "$publishDir/soft_oal.dll")) {
            $debugDir = "src/bin/Debug/net8.0"
            if (Test-Path "$debugDir/soft_oal.dll") {
              Copy-Item "$debugDir/soft_oal.dll" $publishDir -Force
            }
          }
          if (-not (Test-Path "$publishDir/NVorbis.dll")) {
            $debugDir = "src/bin/Debug/net8.0"
            if (Test-Path "$debugDir/NVorbis.dll") {
              Copy-Item "$debugDir/NVorbis.dll" $publishDir -Force
            }
          }

      - name: Copy Content
        run: |
          $publishDir = "src/bin/Release/net8.0/win-x64/publish"
          New-Item -ItemType Directory -Force -Path "$publishDir/Content" | Out-Null
          
          if (Test-Path "src/bin/Content/Windows") {
            Write-Host "Copying from src/bin/Content/Windows"
            Copy-Item -Recurse -Force "src/bin/Content/Windows/*" "$publishDir/Content/"
          }
          elseif (Test-Path "src/obj/Content/Windows") {
            Write-Host "Copying from src/obj/Content/Windows"
            Copy-Item -Recurse -Force "src/obj/Content/Windows/*" "$publishDir/Content/"
          }
          else {
            Write-Error "Error: Content directory not found!"
            exit 1
          }
          
          Write-Host "Content copied:"
          Get-ChildItem -Recurse "$publishDir/Content/"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-publish
          path: src/bin/Release/net8.0/win-x64/publish/

      - name: Zip build output
        run: |
          cd src/bin/Release/net8.0/win-x64/publish
          Compress-Archive -Path * -DestinationPath ../../../EscapeFromWizard_Windows_Release.zip -Force

      - uses: softprops/action-gh-release@v2
        with:
          name: Latest Windows Build
          tag_name: latest-windows
          files: src/bin/Release/EscapeFromWizard_Windows_Release.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true