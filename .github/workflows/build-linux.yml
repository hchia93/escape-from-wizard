name: Build-Linux

on:
  push:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'script/**'
      - '.github/workflows/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'script/**'
      - '.github/workflows/**'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet restore src/escape-from-wizard.csproj

      - name: Restore tools
        run: dotnet tool restore
        working-directory: src

      - run: dotnet build src/escape-from-wizard.csproj --configuration Release --no-restore

      - name: Install fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ttf-mscorefonts-installer

      - name: Build content
        run: dotnet mgcb /@:"Game/Content/Content.mgcb" /platform:DesktopGL
        working-directory: src

      - uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: |
            src/bin/Release/
            src/bin/DesktopGL/
      - run: |
          mkdir -p package
          cp -r src/bin/Release/* package/
          cp -r src/bin/DesktopGL/* package/ || true
          zip -j EscapeFromWizard_Linux_Release.zip src/bin/Release/* src/bin/DesktopGL/* || true
      - uses: softprops/action-gh-release@v2
        with:
          name: Latest Linux Build
          tag_name: latest-linux
          files: EscapeFromWizard_Linux_Release.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
