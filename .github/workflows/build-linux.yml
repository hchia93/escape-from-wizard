name: Build-Linux

on:
  push:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'script/**'
      - '.github/workflows/build-linux.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'script/**'
      - '.github/workflows/build-linux.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore src/escape-from-wizard.csproj

      - name: Restore tools
        run: dotnet tool restore
        working-directory: src

      - name: Build content
        run: dotnet mgcb /@:"Game/Content/Content.mgcb" /platform:DesktopGL
        working-directory: src

      - name: Publish
        run: dotnet publish src/escape-from-wizard.csproj -c Release -r linux-x64 --self-contained true /p:PublishSingleFile=true /p:IncludeNativeLibrariesForSelfExtract=true

      - name: Copy native dependencies and runtimes
        run: |
          PUBLISH_DIR="src/bin/Release/net8.0/linux-x64/publish"
          RELEASE_DIR="src/bin/Release/net8.0/linux-x64"
          
          # Copy native libraries from Release directory only
          if [ -f "$RELEASE_DIR/libSDL2-2.0.so" ]; then
            cp "$RELEASE_DIR/libSDL2-2.0.so" "$PUBLISH_DIR/"
            echo "Copied libSDL2-2.0.so"
          fi
          
          if [ -f "$RELEASE_DIR/libopenal.so.1" ]; then
            cp "$RELEASE_DIR/libopenal.so.1" "$PUBLISH_DIR/"
            echo "Copied libopenal.so.1"
          fi
          
          # Copy runtimes folder if exists
          if [ -d "$RELEASE_DIR/runtimes" ]; then
            echo "Copying runtimes folder"
            cp -r "$RELEASE_DIR/runtimes" "$PUBLISH_DIR/"
          fi

      - name: Copy Content (remove Game/Content hierarchy)
        run: |
          PUBLISH_DIR="src/bin/Release/net8.0/linux-x64/publish"
          CONTENT_SOURCE="src/bin/Content/DesktopGL"
          
          mkdir -p "$PUBLISH_DIR/Content"
          
          # Check for Game/Content nested directory
          if [ -d "$CONTENT_SOURCE/Game/Content" ]; then
            echo "Copying from: $CONTENT_SOURCE/Game/Content/"
            cp -r "$CONTENT_SOURCE/Game/Content/"* "$PUBLISH_DIR/Content/"
          else
            echo "Copying from: $CONTENT_SOURCE/"
            cp -r "$CONTENT_SOURCE/"* "$PUBLISH_DIR/Content/"
          fi
          
          # List copied content
          echo -e "\nContent structure:"
          ls -R "$PUBLISH_DIR/Content/"

      - name: Verify package structure
        run: |
          PUBLISH_DIR="src/bin/Release/net8.0/linux-x64/publish"
          echo -e "\n=== Package Structure ==="
          ls -lh "$PUBLISH_DIR"
          echo -e "\n=== Content Directory ==="
          if [ -d "$PUBLISH_DIR/Content" ]; then
            ls -R "$PUBLISH_DIR/Content/"
          else
            echo "ERROR: Content directory not found!"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-publish
          path: src/bin/Release/net8.0/linux-x64/publish/

      - name: Zip build output
        run: |
          cd src/bin/Release/net8.0/linux-x64/publish
          zip -r ../../../EscapeFromWizard_Linux_Release.zip .

      - uses: softprops/action-gh-release@v2
        with:
          name: Latest Linux Build
          tag_name: latest-linux
          files: src/bin/Release/EscapeFromWizard_Linux_Release.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true